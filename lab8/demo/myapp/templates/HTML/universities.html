{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universități din România</title>
    <link rel="stylesheet" href="{% static 'CSS/universities_style.css' %}">
</head>
<body>
    
    <header>
        <div class="container">
            <nav>
                <a href="{% url 'home' %}">Acasă</a>
                <a href="{% url 'home' %}#facultati">Facultăți</a>
                <a href="{% url 'home' %}#tehnologii">Tehnologii</a>
                <a href="{% url 'chatbot' %}">Chatbot</a>
                <a href="{% url 'galerie' %}">Galerie foto</a>
                <a href="{% url 'library' %}">Bibliotecă</a>
                <a href="{% url 'login' %}">Logout</a>
            </nav>
        </div>
    </header>

    <div>
        <h1>Universități din România</h1>
        <label for="q">Filtru (opțional):</label>
        <input id="q" placeholder="caută după nume…" />
        <button id="exportBtn">Export CSV</button>
        <div id="status" class="status"></div>

        <table>
            <thead>
                <tr>
                    <th>Nume</th>
                    <th>Țara</th>
                    <th>Site</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script src="{% static 'JS/universities_js.js' %}"></script>
</body>
</html>
