{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie foto</title>
    <link rel="stylesheet" href="{% static 'CSS/home_style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/galerie.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/cursor.css' %}">
</head>
<body>

    <header>
        <div class="container">
            <h1>Galerie foto</h1>
            <nav>
                <a href="{% url 'home' %}">Acasă</a>
                <a href="{% url 'home' %}#facultati">Facultăți</a>
                <a href="{% url 'home' %}#tehnologii">Tehnologii</a>
                <a href="{% url 'chatbot' %}">Chatbot</a>
                <a href="{% url 'universities' %}">Universități</a>
                <a href="{% url 'library' %}">Bibliotecă</a>
                <a href="{% url 'login' %}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <div class="carousel-container">
            <div class="carousel-view">
                <img id="carousel-image" src="{% static 'MEDIA/g1.jpg' %}" alt="Carusel">
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Comunitatea de Tehnologii Web</p>
        </div>
    </footer>

    <script type="module" src="{% static 'TS/galerie.js' %}?v=2"></script>
    <script src="{% static 'TS/cursor.js' %}"></script>
</body>
</html>
