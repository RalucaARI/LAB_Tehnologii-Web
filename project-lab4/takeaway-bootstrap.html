
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take-away Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="container">
        <h1>My Website</h1>
        <nav class="d-flex justify-content-between align-items-center">
            <span>Brand</span>
            <div>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#gallery">Gallery</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section id="home">
            <h2>Welcome</h2>
            <p>Welcome to my website!</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This is a responsive website.</p>
        </section>

        <section id="gallery">
            <h2>Gallery</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6">Card 1</div>
                <div class="col-12 col-md-6">Card 2</div>
                <div class="col-12 col-md-6">Card 3</div>
                <div class="col-12 col-md-6">Card 4</div>
                <div class="col-12 col-md-6">Card 5</div>
                <div class="col-12 col-md-6">Card 6</div>
            </div>
        </section>
    </main>
</body>
</html>
