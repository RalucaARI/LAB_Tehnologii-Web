
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take-away Exercise</title>
    <link rel="stylesheet" href="css/takeaway.css">
</head>
<body>
    <header>
        <h1>My Website</h1>
        <nav>
            <span>Brand</span>
            <div>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#gallery">Gallery</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Welcome</h2>
            <p>Welcome to my website!</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This is a responsive website.</p>
        </section>

        <section id="gallery">
            <h2>Gallery</h2>
            <div class="gallery">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
                <div class="card">Card 3</div>
                <div class="card">Card 4</div>
                <div class="card">Card 5</div>
                <div class="card">Card 6</div>
            </div>
        </section>
    </main>
</body>
</html>
